<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de arquitetura do ConectIn</title>
<desc>Usuário se conecta à interface HTML/CSS/JS, que se comunica com o backend Java/Spring, que acessa o banco de dados MySQL.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3C3489" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<circle cx="70" cy="130" r="34" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="70" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#26215C">Usuário</text>
<text x="70" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">Candidato /</text>
<text x="70" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">Empregador</text>

<line x1="106" y1="130" x2="188" y2="130" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="80" width="180" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="280" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Interface</text>
<text x="280" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">HTML, CSS e</text>
<text x="280" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">JavaScript</text>

<line x1="372" y1="130" x2="454" y2="130" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="413" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">requisições HTTP</text>

<rect x="456" y="80" width="200" height="100" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="556" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Backend / Servidor</text>
<text x="556" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Java + Spring</text>
<text x="556" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#712B13">(regras de negócio)</text>

<line x1="658" y1="130" x2="740" y2="130" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="699" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">consultas SQL</text>

<rect x="742" y="80" width="140" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="812" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#042C53">Banco de</text>
<text x="812" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#042C53">Dados</text>
<text x="812" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">MySQL</text>

<text x="450" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">Diagrama simples de arquitetura — ConectIn</text>
</svg>
