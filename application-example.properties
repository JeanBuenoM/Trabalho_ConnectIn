# Modelo de configuração do ConectIn.
# Copie este arquivo para "application.properties" (mesma pasta) e troque a senha pela sua.
# O application.properties NÃO vai para o GitHub (está no .gitignore).

spring.application.name=conectin
server.port=8080

# Conexão com o MySQL (o banco "conectin" é criado pelo banco-de-dados/schema.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/conectin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=COLOQUE_A_SUA_SENHA_AQUI

# Enquanto não há login (previsto para 06/11), as vagas são publicadas por este empregador de teste.
# O registro é criado por banco-de-dados/dados-teste.sql.
conectin.empregador-teste-id=1
