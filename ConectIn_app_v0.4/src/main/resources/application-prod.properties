# configuracao usada na nuvem (Railway). As senhas vem das variaveis do painel.
spring.application.name=conectin
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=20MB

conectin.jwt.segredo=${JWT_SEGREDO}
conectin.jwt.validade-horas=168
conectin.uploads.pasta=uploads
